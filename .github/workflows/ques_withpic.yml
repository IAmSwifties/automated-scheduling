name: Daily Topic Question

on:
  schedule:
    - cron: '0 1 * * 1'  # 台灣時間每週一 09:00
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 快取套件
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow google-genai openai

      - name: 下載中文字型
        run: |
          wget -O /tmp/NotoSansTC.ttf "https://github.com/googlefonts/noto-cjk/raw/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf"

      - name: 執行程式
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TZUYIN_CHAT_ID: ${{ secrets.TZUYIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python ques_withpic.py

      - name: 更新已用主題紀錄
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add used_topics.json
          git diff --staged --quiet || git commit -m "更新已用主題紀錄"
          git push
